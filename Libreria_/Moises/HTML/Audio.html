<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio: Audio en HTML</title>
</head>
<body>

  <!-- Encabezado de la página -->
  <header>
    <h1>Ejercicio: Audio</h1>
    <p>Ejercicio de agregar un audio en HTML</p>
  </header>

  <!-- Un solo contenido principal para toda la página -->
  <main>

    <!-- Sección 1: Audio desde Internet -->
    <section>
    <h2> Audio desde una carpeta </h2>
      <audio controls>
        <source src="Audio/Audio_1.mp3" type="audio/mp3">
      </audio>
    </section>

    <!-- Sección 2: Audio desde Carpeta Local -->
    <section>
    <h2> Audio desde una URL </h2>
    <audio controls>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>
    </section>

  </main>

  <p> </p>
  <p> </p>

</body>
</html>
